<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebTraceView</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Consolas', 'Monaco', 'Courier New', monospace; background: #1e1e1e; color: #d4d4d4; display: flex; flex-direction: column; height: 100vh; }
.header { background: #2d2d2d; padding: 8px 16px; border-bottom: 1px solid #404040; display: flex; align-items: center; gap: 12px; flex-shrink: 0; flex-wrap: wrap; }
.header h1 { font-size: 14px; color: #569cd6; }
.header .info { font-size: 12px; color: #808080; }
.header .indexing { color: #dcdcaa; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.header input { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 4px 8px; font-size: 12px; font-family: inherit; border-radius: 3px; }
.pager { display: flex; align-items: center; gap: 6px; }
.pager button { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 3px 10px; font-size: 12px; font-family: inherit; border-radius: 3px; cursor: pointer; }
.pager button:hover:not(:disabled) { background: #505050; }
.pager button:disabled { opacity: 0.4; cursor: default; }
.pager span { font-size: 12px; color: #9cdcfe; }
.main { display: flex; flex: 1; overflow: hidden; }
.instr-panel { width: 55%; border-right: 1px solid #404040; display: flex; flex-direction: column; }
.instr-search { display: flex; gap: 6px; padding: 6px 8px; background: #252525; border-bottom: 1px solid #404040; align-items: center; }
.instr-search input { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 3px 6px; font-size: 11px; font-family: inherit; border-radius: 3px; }
.instr-search button { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 3px 8px; font-size: 11px; font-family: inherit; border-radius: 3px; cursor: pointer; }
.instr-search button:hover { background: #505050; }
.instr-search-progress { font-size: 11px; color: #808080; }
.instr-search-results { max-height: 180px; overflow-y: auto; border-bottom: 1px solid #404040; background: #1a1a2e; }
.isr-row { padding: 3px 8px; font-size: 11px; cursor: pointer; display: flex; gap: 8px; border-bottom: 1px solid #2a2a2a; white-space: nowrap; }
.isr-row:hover { background: #264f78; }
.isr-row .isr-idx { color: #858585; width: 60px; flex-shrink: 0; }
.isr-row .isr-pc { color: #4ec9b0; width: 100px; flex-shrink: 0; }
.isr-row .isr-instr { color: #dcdcaa; width: 180px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; }
.isr-row .isr-regs { color: #9cdcfe; flex: 1; overflow: hidden; text-overflow: ellipsis; }
.mem-panel { width: 45%; display: flex; flex-direction: column; }
.panel-header { background: #2d2d2d; padding: 6px 12px; font-size: 12px; color: #569cd6; border-bottom: 1px solid #404040; flex-shrink: 0; }
.instr-container { flex: 1; overflow-y: auto; }
.instr-row { padding: 2px 8px; font-size: 12px; cursor: pointer; display: flex; white-space: nowrap; border-bottom: 1px solid #2a2a2a; height: 22px; line-height: 18px; align-items: center; }
.instr-row:hover { background: #264f78; }
.instr-row.selected { background: #094771; }
.instr-row .idx { color: #858585; width: 70px; flex-shrink: 0; text-align: right; padding-right: 12px; }
.instr-row .pc { color: #4ec9b0; width: 120px; flex-shrink: 0; }
.instr-row .asm { color: #dcdcaa; width: 200px; flex-shrink: 0; }
.instr-row .asm.call-instr { color: #569cd6; }
.instr-row .asm.ret-instr { color: #c586c0; }
.instr-row .depth-bar { color: #555; flex-shrink: 0; white-space: pre; font-size: 10px; }
.instr-row .regs { color: #9cdcfe; flex: 1; overflow: hidden; text-overflow: ellipsis; }
.mem-container { flex: 1; overflow-y: auto; padding: 8px; }
.mem-region { margin-bottom: 16px; }
.mem-region-header { color: #4ec9b0; font-size: 12px; margin-bottom: 4px; padding: 4px; background: #2d2d2d; border-radius: 3px; }
.mem-region-header.read { border-left: 3px solid #4ec9b0; }
.mem-region-header.write { border-left: 3px solid #ce9178; }
.hex-dump { font-size: 11px; line-height: 18px; }
.hex-line { display: flex; }
.hex-addr { color: #858585; width: 100px; flex-shrink: 0; }
.hex-bytes { color: #ce9178; flex: 1; letter-spacing: 0.5px; }
.hex-bytes .hl { background: #b5890069; color: #ffd700; font-weight: bold; }
.hex-bytes .active-read { background: #1e3a2e; color: #4ec9b0; font-weight: bold; }
.hex-bytes .active-write { background: #3a1e1e; color: #ff8c69; font-weight: bold; }
.hex-ascii .active-read { background: #1e3a2e; color: #4ec9b0; }
.hex-ascii .active-write { background: #3a1e1e; color: #ff8c69; }
.hex-ascii { color: #6a9955; width: 140px; flex-shrink: 0; padding-left: 8px; }
.hex-ascii .hl { background: #b5890069; color: #ffd700; font-weight: bold; }
.loading { color: #808080; padding: 20px; text-align: center; font-size: 13px; }
.status-bar { background: #007acc; color: white; padding: 2px 12px; font-size: 11px; flex-shrink: 0; display: flex; justify-content: space-between; }
.mem-search { display: flex; gap: 6px; padding: 6px 8px; background: #2d2d2d; border-bottom: 1px solid #404040; align-items: center; flex-wrap: wrap; }
.mem-search input { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 3px 6px; font-size: 11px; font-family: inherit; border-radius: 3px; }
.mem-search select { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 3px 4px; font-size: 11px; font-family: inherit; border-radius: 3px; }
.mem-search button { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 3px 8px; font-size: 11px; font-family: inherit; border-radius: 3px; cursor: pointer; }
.mem-search button:hover { background: #505050; }
.global-search { display: flex; gap: 6px; padding: 6px 8px; background: #252525; border-bottom: 1px solid #404040; align-items: center; flex-wrap: wrap; }
.global-search input { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 3px 6px; font-size: 11px; font-family: inherit; border-radius: 3px; }
.global-search select { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 3px 4px; font-size: 11px; font-family: inherit; border-radius: 3px; }
.global-search button { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 3px 8px; font-size: 11px; font-family: inherit; border-radius: 3px; cursor: pointer; }
.global-search button:hover { background: #505050; }
.search-progress { font-size: 11px; color: #808080; }
.search-results { max-height: 200px; overflow-y: auto; border-bottom: 1px solid #404040; }
.search-result-row { padding: 3px 8px; font-size: 11px; cursor: pointer; display: flex; gap: 10px; border-bottom: 1px solid #2a2a2a; }
.search-result-row:hover { background: #264f78; }
.search-result-row .sr-idx { color: #858585; width: 60px; flex-shrink: 0; }
.search-result-row .sr-pc { color: #4ec9b0; width: 100px; flex-shrink: 0; }
.search-result-row .sr-instr { color: #dcdcaa; width: 160px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search-result-row .sr-addr { color: #ce9178; width: 100px; flex-shrink: 0; }
.search-result-row .sr-type { width: 30px; flex-shrink: 0; }
.results-pager { display: flex; gap: 6px; padding: 3px 8px; background: #252525; border-bottom: 1px solid #404040; align-items: center; font-size: 11px; color: #808080; }
.results-pager button { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 2px 8px; font-size: 11px; font-family: inherit; border-radius: 3px; cursor: pointer; }
.results-pager button:hover { background: #505050; }
.results-pager button:disabled { opacity: 0.4; cursor: default; }
.result-section { border-bottom: 1px solid #404040; }
.result-section-header { display: flex; align-items: center; gap: 6px; padding: 3px 8px; background: #2a2a3a; cursor: pointer; font-size: 11px; color: #569cd6; user-select: none; }
.result-section-header:hover { background: #333350; }
.result-section-header .rs-arrow { transition: transform 0.15s; display: inline-block; }
.result-section-header .rs-arrow.collapsed { transform: rotate(-90deg); }
.result-section-header .rs-label { flex: 1; }
.result-section-header .rs-badge { background: #404060; color: #d4d4d4; padding: 1px 6px; border-radius: 8px; font-size: 10px; }
.result-section-body { overflow: hidden; }
.result-section-body.collapsed { display: none; }
.func-name-btn { background: none; border: none; color: #569cd6; cursor: pointer; font-size: 11px; padding: 0 4px; font-family: inherit; }
.func-name-btn:hover { text-decoration: underline; }
.func-name { color: #dcdcaa; font-size: 10px; }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; display: flex; align-items: center; justify-content: center; }
.modal-box { background: #1e1e1e; border: 1px solid #555; border-radius: 6px; width: 90vw; height: 80vh; display: flex; flex-direction: column; }
.modal-header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #2d2d2d; border-bottom: 1px solid #404040; border-radius: 6px 6px 0 0; }
.modal-header h2 { font-size: 13px; color: #569cd6; flex: 1; }
.modal-header button { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 3px 8px; font-size: 11px; font-family: inherit; border-radius: 3px; cursor: pointer; }
.modal-header button:hover { background: #505050; }
.modal-body { flex: 1; overflow: hidden; padding: 0; position: relative; }
.mem-tag { font-size: 9px; padding: 0 3px; border-radius: 2px; flex-shrink: 0; font-weight: bold; }
.mem-tag.r { color: #4ec9b0; background: #1e3a2e; }
.mem-tag.w { color: #ce9178; background: #3a1e1e; }
.mem-tag.rw { color: #dcdcaa; background: #3a3a1e; }
.sr-type.read { color: #4ec9b0; }
.sr-type.write { color: #ce9178; }
/* 书签 */
.bookmark-bar { display: flex; gap: 6px; padding: 4px 8px; background: #2d2d2d; border-bottom: 1px solid #404040; align-items: center; }
.bookmark-bar button { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 3px 8px; font-size: 11px; font-family: inherit; border-radius: 3px; cursor: pointer; }
.bookmark-bar button:hover { background: #505050; }
.bookmark-bar select { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 3px 4px; font-size: 11px; font-family: inherit; border-radius: 3px; max-width: 300px; }
.instr-row .bm-icon { color: #e2b714; flex-shrink: 0; font-size: 10px; width: 14px; text-align: center; }
/* Diff */
.diff-bar { display: none; }
/* 寄存器追踪 */
.reg-trace-canvas { width: 100%; height: 120px; border-bottom: 1px solid #404040; background: #1a1a2e; }
</style>
</head>
<body>
<div class="header">
  <h1>WebTraceView</h1>
  <span class="info" id="totalInfo">连接中...</span>
  <div class="pager">
    <button id="btnFirst" title="第一页">⏮</button>
    <button id="btnPrev" title="上一页">◀</button>
    <span id="pageInfo">-</span>
    <button id="btnNext" title="下一页">▶</button>
    <button id="btnLast" title="最后一页">⏭</button>
  </div>
  <input type="text" id="gotoBox" placeholder="跳转行号..." style="width:100px">
  <input type="text" id="gotoPage" placeholder="跳转页码..." style="width:100px">
</div>
<div class="main">
  <div class="instr-panel">
    <div class="panel-header">指令列表</div>
    <div class="bookmark-bar">
      <button id="btnAddBookmark" title="给当前选中指令添加书签">📌 添加书签</button>
      <button id="btnDelBookmark" title="删除当前选中指令的书签">删除</button>
      <select id="bookmarkList"><option value="">-- 书签列表 --</option></select>
    </div>
    <div class="instr-search">
      <input type="text" id="instrSearchInput" placeholder="搜索指令/地址/寄存器..." style="width:200px">
      <button id="btnInstrSearch">搜索</button>
      <button id="btnInstrSearchStop" style="display:none">停止</button>
      <span class="instr-search-progress" id="instrSearchProgress"></span>
    </div>
    <div class="result-section" id="secInstrSearch" style="display:none">
      <div class="result-section-header" onclick="toggleSection('secInstrSearch')">
        <span class="rs-arrow">▼</span><span class="rs-label">🔎 指令搜索结果</span><span class="rs-badge" id="instrSearchBadge">0</span>
      </div>
      <div class="result-section-body" id="instrSearchResults"></div>
    </div>
    <div class="instr-container" id="instrContainer"></div>
  </div>
  <div class="mem-panel">
    <div class="panel-header" id="memHeader">内存访问窗口 (点击左侧指令查看)</div>
    <div class="mem-search">
      <input type="text" id="hlAddr" placeholder="地址 0x..." style="width:100px">
      <input type="text" id="hlSize" placeholder="size" style="width:40px" value="4">
      <button id="btnHighlight">高亮</button>
      <button id="btnClearHl">清除</button>
      <span style="color:#555">│</span>
      <input type="text" id="localSearchInput" placeholder="当前搜索..." style="width:100px">
      <select id="localSearchType"><option value="hex">Hex</option><option value="string">Str</option></select>
      <button id="btnLocalSearch">查找</button>
      <span id="localSearchInfo" style="font-size:11px;color:#808080"></span>
      <span style="color:#555">│</span>
      <input type="text" id="searchPattern" placeholder="全局搜索..." style="width:100px">
      <select id="searchType"><option value="hex">Hex</option><option value="string">Str</option></select>
      <button id="btnSearch">搜索</button>
      <button id="btnStopSearch" style="display:none">停止</button>
      <span class="search-progress" id="searchProgress"></span>
    </div>
    <div class="mem-search">
      <input type="text" id="wpAddr" placeholder="监控地址 0x..." style="width:110px">
      <input type="text" id="wpSize" placeholder="size" style="width:50px" value="8">
      <button id="btnWatchpoint">监控点</button>
      <button id="btnWpStop" style="display:none">停止</button>
      <span style="color:#555">│</span>
      <input type="text" id="regTraceInput" placeholder="寄存器 x0/sp..." style="width:80px">
      <input type="text" id="regTraceFrom" placeholder="从#" style="width:60px">
      <input type="text" id="regTraceTo" placeholder="到#" style="width:60px">
      <button id="btnRegTrace">追踪</button>
      <button id="btnRegTraceStop" style="display:none">停止</button>
      <span style="color:#555">│</span>
      <button id="btnFuncList">函数列表</button>
      <button id="btnCallTimeline">调用时间线</button>
      <span id="wpRegProgress" style="font-size:11px;color:#808080"></span>
    </div>
    <div class="result-section" id="secWpResults" style="display:none">
      <div class="result-section-header" onclick="toggleSection('secWpResults')">
        <span class="rs-arrow">▼</span><span class="rs-label">📍 监控点结果</span><span class="rs-badge" id="wpBadge">0</span>
      </div>
      <div class="result-section-body" id="wpResults"></div>
    </div>
    <div class="result-section" id="secRegTrace" style="display:none">
      <div class="result-section-header" onclick="toggleSection('secRegTrace')">
        <span class="rs-arrow">▼</span><span class="rs-label">📊 寄存器追踪</span><span class="rs-badge" id="regBadge">0</span>
      </div>
      <div class="result-section-body">
        <div id="regTraceResults"></div>
        <canvas class="reg-trace-canvas" id="regTraceCanvas"></canvas>
      </div>
    </div>
    <div class="result-section" id="secFuncList" style="display:none">
      <div class="result-section-header" onclick="toggleSection('secFuncList')">
        <span class="rs-arrow">▼</span><span class="rs-label">📋 函数列表</span><span class="rs-badge" id="funcBadge">0</span>
      </div>
      <div class="result-section-body">
        <div style="padding:4px 8px;display:flex;gap:6px;align-items:center">
          <input type="text" id="funcSearchInput" placeholder="搜索地址/函数名..." style="width:180px;background:#3c3c3c;border:1px solid #555;color:#d4d4d4;padding:3px 6px;font-size:11px;font-family:inherit;border-radius:3px">
        </div>
        <div id="funcListResults"></div>
      </div>
    </div>
    <div class="result-section" id="secSearchResults" style="display:none">
      <div class="result-section-header" onclick="toggleSection('secSearchResults')">
        <span class="rs-arrow">▼</span><span class="rs-label">🔍 全局内存搜索结果</span><span class="rs-badge" id="memSearchBadge">0</span>
      </div>
      <div class="result-section-body" id="searchResults"></div>
    </div>
    <div class="mem-container" id="memContainer">
      <div class="loading">点击左侧任意指令查看该时刻的内存状态</div>
    </div>
  </div>
</div>
<div class="status-bar">
  <span id="statusBar">就绪</span>
  <span id="indexStatus"></span>
</div>

<div id="timelineFloat" style="display:none;position:fixed;right:20px;top:60px;width:500px;height:400px;z-index:999;background:#1e1e1e;border:1px solid #555;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,0.5);display:none;flex-direction:column;resize:both;overflow:hidden">
  <div id="tlDragBar" style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:#2d2d2d;border-bottom:1px solid #404040;border-radius:6px 6px 0 0;cursor:move;user-select:none;flex-shrink:0">
    <span style="font-size:12px;color:#569cd6;flex:1">📊 函数调用流程</span>
    <input type="text" id="tlSearch" placeholder="搜索..." style="background:#3c3c3c;border:1px solid #555;color:#d4d4d4;padding:2px 6px;font-size:10px;font-family:inherit;border-radius:3px;width:120px">
    <span id="tlInfo" style="font-size:10px;color:#808080"></span>
    <button id="tlClose" style="background:none;border:none;color:#808080;cursor:pointer;font-size:14px;padding:0 4px">✕</button>
  </div>
  <div id="tlBody" style="flex:1;overflow:hidden;font-size:11px;font-family:monospace"></div>
</div>

<script>
const PAGE_SIZE = 500;
let totalRecords = 0;
let indexDone = false;
let currentPage = 0;
let totalPages = 0;
let pageItems = [];
let selectedIdx = -1;
let loading = false;
let pollTimer = null;
let minPageInView = 0;
let hlAddr = -1, hlSize = 0;  // 高亮范围
let lastRegions = null;       // 缓存当前显示的 regions

const container = document.getElementById('instrContainer');

// ==================== 云端会话持久化 ====================
let _sessionSaveTimer = null;
let _sessionLoaded = false;

function collectSession() {
  return {
    currentPage,
    selectedIdx,
    hlAddr,
    hlSize,
    hlAddrInput: document.getElementById('hlAddr').value,
    hlSizeInput: document.getElementById('hlSize').value,
    bookmarks: typeof bookmarks !== 'undefined' ? bookmarks : {},
    funcNames: typeof funcNames !== 'undefined' ? funcNames : {},
    // 搜索词
    instrSearchKeyword: document.getElementById('instrSearchInput').value,
    globalSearchPattern: document.getElementById('searchPattern').value,
    globalSearchType: document.getElementById('searchType').value,
    localSearchInput: document.getElementById('localSearchInput').value,
    localSearchType: document.getElementById('localSearchType').value,
    // 监控点
    wpAddr: document.getElementById('wpAddr').value,
    wpSize: document.getElementById('wpSize').value,
    // 寄存器追踪
    regTraceReg: document.getElementById('regTraceInput').value,
    regTraceFrom: document.getElementById('regTraceFrom').value,
    regTraceTo: document.getElementById('regTraceTo').value,
    // 跳转框
    gotoBox: document.getElementById('gotoBox').value,
    gotoPage: document.getElementById('gotoPage').value,
    // 滚动位置
    scrollTop: container.scrollTop,
    // 时间线面板是否打开
    timelineOpen: document.getElementById('timelineFloat').style.display === 'flex',
    // 函数搜索
    funcSearchInput: document.getElementById('funcSearchInput').value,
    // 时间线搜索
    tlSearch: document.getElementById('tlSearch').value,
  };
}

function saveSession() {
  if (_sessionSaveTimer) clearTimeout(_sessionSaveTimer);
  _sessionSaveTimer = setTimeout(() => {
    const data = collectSession();
    fetch('/api/session', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    }).catch(() => {});
  }, 800);
}

async function loadSession() {
  try {
    const resp = await fetch('/api/session');
    if (!resp.ok) return null;
    const data = await resp.json();
    if (!data || typeof data !== 'object') return null;
    return data;
  } catch(e) { return null; }
}

async function restoreSession(session) {
  if (!session) return;
  _sessionLoaded = true;

  // 恢复书签
  if (session.bookmarks && typeof session.bookmarks === 'object') {
    for (const k of Object.keys(session.bookmarks)) {
      bookmarks[k] = session.bookmarks[k];
    }
    saveBookmarksQuiet();
    refreshBookmarkList();
  }

  // 恢复函数命名
  if (session.funcNames && typeof session.funcNames === 'object') {
    for (const k of Object.keys(session.funcNames)) {
      funcNames[k] = session.funcNames[k];
    }
    saveFuncNamesQuiet();
  }

  // 恢复输入框
  if (session.hlAddrInput) document.getElementById('hlAddr').value = session.hlAddrInput;
  if (session.hlSizeInput) document.getElementById('hlSize').value = session.hlSizeInput;
  if (session.instrSearchKeyword) document.getElementById('instrSearchInput').value = session.instrSearchKeyword;
  if (session.globalSearchPattern) document.getElementById('searchPattern').value = session.globalSearchPattern;
  if (session.globalSearchType) document.getElementById('searchType').value = session.globalSearchType;
  if (session.localSearchInput) document.getElementById('localSearchInput').value = session.localSearchInput;
  if (session.localSearchType) document.getElementById('localSearchType').value = session.localSearchType;
  if (session.wpAddr) document.getElementById('wpAddr').value = session.wpAddr;
  if (session.wpSize) document.getElementById('wpSize').value = session.wpSize;
  if (session.regTraceReg) document.getElementById('regTraceInput').value = session.regTraceReg;
  if (session.regTraceFrom) document.getElementById('regTraceFrom').value = session.regTraceFrom;
  if (session.regTraceTo) document.getElementById('regTraceTo').value = session.regTraceTo;

  // 恢复高亮
  if (typeof session.hlAddr === 'number' && session.hlAddr >= 0) {
    hlAddr = session.hlAddr;
    hlSize = session.hlSize || 0;
  }

  // 恢复页码和选中行
  if (typeof session.currentPage === 'number' && session.currentPage > 0) {
    await gotoPage(session.currentPage);
  }
  if (typeof session.selectedIdx === 'number' && session.selectedIdx >= 0) {
    selectedIdx = session.selectedIdx;
    await selectInstruction(session.selectedIdx);
    // 滚动到选中行
    setTimeout(() => {
      const row = container.querySelector('[data-idx="' + session.selectedIdx + '"]');
      if (row) row.scrollIntoView({ block: 'center' });
    }, 100);
  } else if (typeof session.scrollTop === 'number') {
    container.scrollTop = session.scrollTop;
  }

  // 恢复时间线面板
  if (session.timelineOpen) {
    document.getElementById('btnCallTimeline').click();
    if (session.tlSearch) {
      setTimeout(() => {
        document.getElementById('tlSearch').value = session.tlSearch;
        document.getElementById('tlSearch').dispatchEvent(new Event('input'));
      }, 500);
    }
  }
}

async function init() {
  await refreshInfo();
  await loadPage(0);

  // 翻页按钮
  document.getElementById('btnFirst').addEventListener('click', () => gotoPage(0));
  document.getElementById('btnPrev').addEventListener('click', () => gotoPage(currentPage - 1));
  document.getElementById('btnNext').addEventListener('click', () => gotoPage(currentPage + 1));
  document.getElementById('btnLast').addEventListener('click', () => gotoPage(totalPages - 1));

  // 滚到底自动下一页，滚到顶自动上一页
  container.addEventListener('scroll', () => {
    if (loading) return;
    const { scrollTop, scrollHeight, clientHeight } = container;
    // 滚到底
    if (scrollTop + clientHeight >= scrollHeight - 10) {
      if (currentPage < totalPages - 1) gotoPage(currentPage + 1, 'append');
    }
    // 滚到顶
    if (scrollTop <= 10) {
      if (minPageInView > 0) {
        minPageInView--;
        loadPagePrepend(minPageInView);
      }
    }
  });

  // 点击指令行
  container.addEventListener('click', e => {
    const row = e.target.closest('.instr-row');
    if (row) selectInstruction(parseInt(row.dataset.idx));
  });

  // 跳转行号
  document.getElementById('gotoBox').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const line = parseInt(e.target.value);
      if (!isNaN(line) && line >= 0 && line < totalRecords) {
        const page = Math.floor(line / PAGE_SIZE);
        gotoPage(page).then(() => {
          const row = container.querySelector('[data-idx="' + line + '"]');
          if (row) row.scrollIntoView({ block: 'center' });
        });
        e.target.value = '';
      }
    }
  });

  // 跳转页码
  document.getElementById('gotoPage').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const p = parseInt(e.target.value) - 1; // 用户输入从1开始
      if (!isNaN(p) && p >= 0 && p < totalPages) {
        gotoPage(p);
      }
      e.target.value = '';
    }
  });

  // 高亮搜索
  function applyHighlight() {
    const addrVal = document.getElementById('hlAddr').value.trim();
    const sizeVal = parseInt(document.getElementById('hlSize').value) || 0;
    if (!addrVal || sizeVal <= 0) return;
    hlAddr = parseInt(addrVal, 16);
    hlSize = sizeVal;
    if (lastRegions) renderMemory(lastRegions);
  }
  document.getElementById('btnHighlight').addEventListener('click', () => { applyHighlight(); saveSession(); });
  document.getElementById('hlAddr').addEventListener('keydown', e => { if (e.key === 'Enter') { applyHighlight(); saveSession(); } });
  document.getElementById('hlSize').addEventListener('keydown', e => { if (e.key === 'Enter') { applyHighlight(); saveSession(); } });
  document.getElementById('btnClearHl').addEventListener('click', () => {
    hlAddr = -1; hlSize = 0;
    document.getElementById('hlAddr').value = '';
    document.getElementById('localSearchInfo').textContent = '';
    if (lastRegions) renderMemory(lastRegions);
    saveSession();
  });

  // 当前窗口搜索
  function doLocalSearch() {
    const input = document.getElementById('localSearchInput').value.trim();
    const type = document.getElementById('localSearchType').value;
    const info = document.getElementById('localSearchInfo');
    if (!input || !lastRegions || lastRegions.length === 0) {
      info.textContent = '无数据';
      return;
    }

    let pattern;
    if (type === 'hex') {
      const clean = input.replace(/[^0-9a-fA-F]/g, '');
      if (clean.length === 0 || clean.length % 2 !== 0) {
        info.textContent = '无效 hex';
        return;
      }
      pattern = clean.toLowerCase();
    } else {
      // string → 转成 hex
      pattern = '';
      for (let i = 0; i < input.length; i++) {
        pattern += input.charCodeAt(i).toString(16).padStart(2, '0');
      }
    }

    // 在所有 region 的 hex 数据里搜索
    let matches = [];
    for (const region of lastRegions) {
      const hexData = region.hex.toLowerCase();
      let pos = 0;
      while (true) {
        const idx = hexData.indexOf(pattern, pos);
        if (idx < 0) break;
        const byteOffset = idx / 2;
        const matchAddr = parseInt(region.base, 16) + byteOffset;
        matches.push({ addr: matchAddr, size: pattern.length / 2, type: region.type });
        pos = idx + 2; // 按字节步进
      }
    }

    if (matches.length === 0) {
      info.textContent = '未找到';
      return;
    }

    // 高亮第一个匹配
    const first = matches[0];
    hlAddr = first.addr;
    hlSize = first.size;
    document.getElementById('hlAddr').value = '0x' + first.addr.toString(16);
    document.getElementById('hlSize').value = first.size;
    renderMemory(lastRegions);

    info.textContent = '找到 ' + matches.length + ' 处';

    // 滚动到第一个高亮位置
    const hlEl = document.querySelector('.hex-bytes .hl');
    if (hlEl) hlEl.scrollIntoView({ block: 'center' });
  }
  document.getElementById('btnLocalSearch').addEventListener('click', doLocalSearch);
  document.getElementById('localSearchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLocalSearch();
  });

  // 索引未完成时定时刷新
  pollTimer = setInterval(async () => {
    await refreshInfo();
    if (indexDone) {
      clearInterval(pollTimer);
      document.getElementById('indexStatus').textContent = '';
    }
  }, 2000);

  // 恢复上次会话状态
  const session = await loadSession();
  if (session) await restoreSession(session);

  // 输入框变化时自动保存会话
  const sessionInputs = ['instrSearchInput','searchPattern','localSearchInput','wpAddr','wpSize','regTraceInput','regTraceFrom','regTraceTo','hlAddr','hlSize','funcSearchInput','tlSearch'];
  for (const id of sessionInputs) {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', saveSession);
  }
  // 页面关闭前保存
  window.addEventListener('beforeunload', () => {
    const data = collectSession();
    navigator.sendBeacon('/api/session', JSON.stringify(data));
  });
}

async function refreshInfo() {
  try {
    const info = await fetchJSON('/api/info');
    totalRecords = info.totalRecords;
    indexDone = info.indexDone;
    totalPages = Math.max(1, Math.ceil(totalRecords / PAGE_SIZE));
    const el = document.getElementById('totalInfo');
    if (indexDone) {
      el.className = 'info';
      el.textContent = '共 ' + totalRecords.toLocaleString() + ' 条指令';
    } else {
      el.className = 'info indexing';
      el.textContent = '索引中... ' + totalRecords.toLocaleString() + ' 条';
      document.getElementById('indexStatus').textContent = '后台索引构建中...';
    }
    updatePagerUI();
  } catch(e) {}
}

function updatePagerUI() {
  document.getElementById('pageInfo').textContent =
    (currentPage + 1) + ' / ' + totalPages + ' 页';
  document.getElementById('btnFirst').disabled = currentPage <= 0;
  document.getElementById('btnPrev').disabled = currentPage <= 0;
  document.getElementById('btnNext').disabled = currentPage >= totalPages - 1;
  document.getElementById('btnLast').disabled = currentPage >= totalPages - 1;
}

async function gotoPage(page, mode) {
  if (page < 0 || page >= totalPages || loading) return;
  await loadPage(page, mode);
  saveSession();
}

async function loadPage(page, mode) {
  loading = true;
  currentPage = page;
  if (mode !== 'append') minPageInView = page;
  updatePagerUI();

  const offset = page * PAGE_SIZE;
  const limit = PAGE_SIZE;

  document.getElementById('statusBar').textContent = '加载第 ' + (page + 1) + ' 页...';

  try {
    const data = await fetchJSON('/api/instructions?offset=' + offset + '&limit=' + limit);
    pageItems = data.items || [];
    totalRecords = data.total;
    totalPages = Math.max(1, Math.ceil(totalRecords / PAGE_SIZE));
    renderPage(mode);
    updatePagerUI();
    document.getElementById('statusBar').textContent =
      '第 ' + (page + 1) + ' 页，行 ' + offset + '-' + (offset + pageItems.length - 1) +
      '，共 ' + totalRecords.toLocaleString() + ' 条';
  } catch(e) {
    document.getElementById('statusBar').textContent = '加载失败';
  }
  loading = false;
}

async function loadPagePrepend(page) {
  if (loading || page < 0) return;
  loading = true;
  const offset = page * PAGE_SIZE;
  try {
    const data = await fetchJSON('/api/instructions?offset=' + offset + '&limit=' + PAGE_SIZE);
    const items = data.items || [];
    if (items.length === 0) { loading = false; return; }

    let html = '';
    for (const item of items) {
      const sel = item.index === selectedIdx ? ' selected' : '';
      html += renderInstrRow(item, sel);
    }
    const prevHeight = container.scrollHeight;
    container.insertAdjacentHTML('afterbegin', html);
    // 保持滚动位置不跳
    container.scrollTop += container.scrollHeight - prevHeight;
  } catch(e) {}
  loading = false;
}

function renderInstrRow(item, sel) {
  const instr = (item.instrText || '').toLowerCase();
  const mnemonic = instr.split(' ')[0];
  const isCall = mnemonic === 'bl' || mnemonic === 'blr' || mnemonic === 'blx' ||
    mnemonic === 'blraa' || mnemonic === 'blrab' || mnemonic === 'blraaz' || mnemonic === 'blrabz';
  const isRet = mnemonic === 'ret';
  const asmClass = isCall ? ' call-instr' : isRet ? ' ret-instr' : '';
  const depth = Math.max(0, item.depth || 0);
  const indent = depth > 0 ? '│'.repeat(Math.min(depth, 20)) + ' ' : '';
  const marker = isCall ? '▶ ' : isRet ? '◀ ' : '';
  const bmIcon = bookmarks[item.index] ? '📌' : '';
  const mf = item.memFlag || '';
  const memTag = mf ? '<span class="mem-tag ' + mf.toLowerCase() + '">[' + mf + ']</span>' : '';

  // bl/blr 指令：从操作数提取目标地址，查函数名
  let fnLabel = '';
  if (isCall) {
    const operand = instr.substring(mnemonic.length).trim();
    // bl #0x4005bc04 → 提取地址
    const addrMatch = operand.match(/#?(0x[0-9a-f]+)/);
    if (addrMatch) {
      const fname = getFuncName(addrMatch[1]);
      if (fname) fnLabel = '<span class="func-name">(' + escHtml(fname) + ')</span>';
    }
  }

  return '<div class="instr-row' + sel + '" data-idx="' + item.index + '">'
    + '<span class="bm-icon">' + bmIcon + '</span>'
    + '<span class="idx">' + item.index + '</span>'
    + '<span class="depth-bar">' + indent + '</span>'
    + '<span class="pc">' + item.pc + '</span>'
    + '<span class="asm' + asmClass + '">' + marker + escHtml(item.instrText) + fnLabel + '</span>'
    + memTag
    + '<span class="regs">' + escHtml(item.regText) + '</span>'
    + '</div>';
}

function renderPage(mode) {
  let html = '';
  for (const item of pageItems) {
    const sel = item.index === selectedIdx ? ' selected' : '';
    html += renderInstrRow(item, sel);
  }
  if (mode === 'append') {
    container.insertAdjacentHTML('beforeend', html);
  } else {
    container.innerHTML = html;
    container.scrollTop = 0;
  }
}

async function selectInstruction(idx) {
  selectedIdx = idx;
  container.querySelectorAll('.instr-row.selected').forEach(el => el.classList.remove('selected'));
  const row = container.querySelector('[data-idx="' + idx + '"]');
  if (row) row.classList.add('selected');

  saveSession();

  const memContainer = document.getElementById('memContainer');
  document.getElementById('memHeader').textContent = '内存访问窗口 - 指令 #' + idx;
  memContainer.innerHTML = '<div class="loading">正在还原内存状态...</div>';

  try {
    const data = await fetchJSON('/api/memory?index=' + idx);
    const regions = data.regions || [];
    lastRegions = regions;
    renderMemory(regions);
    document.getElementById('statusBar').textContent = '第 ' + idx + ' 条，' + regions.length + ' 个内存区域';
  } catch (e) {
    memContainer.innerHTML = '<div class="loading">加载失败: ' + escHtml(e.message) + '</div>';
  }
}

function renderMemory(regions) {
  const mc = document.getElementById('memContainer');
  if (!regions || regions.length === 0) {
    mc.innerHTML = '<div class="loading">该指令无内存访问</div>';
    return;
  }
  let html = '';
  for (const region of regions) {
    const typeClass = region.type === 'write' ? 'write' : 'read';
    const typeLabel = region.type === 'write' ? '[W]' : '[R]';
    html += '<div class="mem-region">'
      + '<div class="mem-region-header ' + typeClass + '">' + typeLabel + ' ' + escHtml(region.base) + ' (' + region.size + ' bytes)</div>'
      + '<div class="hex-dump">' + renderHexDump(region.base, region.hex, region.type) + '</div></div>';
  }
  mc.innerHTML = html;
}

function renderHexDump(baseStr, hexStr, regionType) {
  const base = parseInt(baseStr, 16);
  const bytesPerLine = 16;
  const totalBytes = hexStr.length / 2;
  const maxBytes = Math.min(totalBytes, 1024);
  // 实际访问的地址在 chunk 中心，大小 = totalBytes - 256 (两侧各128的窗口)
  const center = base + Math.floor(totalBytes / 2);
  const accessSize = Math.max(1, totalBytes - 256);
  const halfAccess = Math.max(2, Math.floor(accessSize / 2));
  const accessLo = center - halfAccess;
  const accessHi = center + halfAccess;
  const activeCls = regionType === 'write' ? 'active-write' : 'active-read';
  let html = '';
  for (let off = 0; off < maxBytes; off += bytesPerLine) {
    const addr = (base + off).toString(16).padStart(10, '0');
    let hexPart = '';
    let asciiPart = '';
    const lineEnd = Math.min(bytesPerLine, maxBytes - off);
    for (let j = 0; j < lineEnd; j++) {
      const byteAddr = base + off + j;
      const bi = (off + j) * 2;
      const bh = hexStr.substring(bi, bi + 2);
      const bv = parseInt(bh, 16);
      const ch = (bv >= 32 && bv < 127) ? String.fromCharCode(bv) : '.';
      const isHl = hlAddr >= 0 && byteAddr >= hlAddr && byteAddr < hlAddr + hlSize;
      const isAccess = byteAddr >= accessLo && byteAddr < accessHi;
      if (isHl) {
        hexPart += '<span class="hl">' + bh + '</span> ';
        asciiPart += '<span class="hl">' + escHtml(ch) + '</span>';
      } else if (isAccess) {
        hexPart += '<span class="' + activeCls + '">' + bh + '</span> ';
        asciiPart += '<span class="' + activeCls + '">' + escHtml(ch) + '</span>';
      } else {
        hexPart += bh + ' ';
        asciiPart += escHtml(ch);
      }
    }
    html += '<div class="hex-line">'
      + '<span class="hex-addr">' + addr + '</span>'
      + '<span class="hex-bytes">' + hexPart + '</span>'
      + '<span class="hex-ascii">' + asciiPart + '</span></div>';
  }
  if (totalBytes > maxBytes) {
    html += '<div style="color:#808080;padding:4px">... 还有 ' + (totalBytes - maxBytes).toLocaleString() + ' 字节</div>';
  }
  return html;
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.statusText);
  return r.json();
}

// ==================== 指令搜索 ====================
let instrSearchId = null;
let instrSearchPollTimer = null;

const instrSearchPR = new PagedResults({
  el: document.getElementById('instrSearchResults'),
  pageSize: 50,
  fetchUrl: '/api/search/instr?_=1',
  renderRow: (m) => {
    return '<div class="isr-row" data-idx="' + m.index + '">'
      + '<span class="isr-idx">#' + m.index + '</span>'
      + '<span class="isr-pc">' + m.pc + '</span>'
      + '<span class="isr-instr">' + escHtml(m.instrText) + '</span>'
      + '<span class="isr-regs">' + escHtml(m.regText) + '</span></div>';
  },
  onClickRow: (row) => { jumpToInstr(parseInt(row.dataset.idx)); }
});

function initInstrSearch() {
  document.getElementById('btnInstrSearch').addEventListener('click', startInstrSearch);
  document.getElementById('instrSearchInput').addEventListener('keydown', e => { if (e.key === 'Enter') startInstrSearch(); });
  document.getElementById('btnInstrSearchStop').addEventListener('click', stopInstrSearch);
}

async function startInstrSearch() {
  const keyword = document.getElementById('instrSearchInput').value.trim();
  if (!keyword) return;
  stopInstrSearch();
  instrSearchPR.reset();
  try {
    const resp = await fetch('/api/search/instr', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({keyword})
    });
    const data = await resp.json();
    instrSearchId = data.searchId;
    instrSearchPR.fetchUrl = '/api/search/instr?_=1';
    document.getElementById('btnInstrSearch').style.display = 'none';
    document.getElementById('btnInstrSearchStop').style.display = '';
    showSection('secInstrSearch');
    document.getElementById('instrSearchProgress').textContent = '搜索中...';
    instrSearchPollTimer = setInterval(pollInstrSearchResults, 500);
  } catch(e) {
    document.getElementById('instrSearchProgress').textContent = '搜索启动失败';
  }
}

function stopInstrSearch() {
  if (instrSearchPollTimer) { clearInterval(instrSearchPollTimer); instrSearchPollTimer = null; }
  document.getElementById('btnInstrSearch').style.display = '';
  document.getElementById('btnInstrSearchStop').style.display = 'none';
}

async function pollInstrSearchResults() {
  if (!instrSearchId) return;
  try {
    const data = await fetchJSON('/api/search/instr?offset=0&limit=1');
    const pct = data.totalRecords > 0 ? Math.floor(data.scanned / data.totalRecords * 100) : 0;
    document.getElementById('instrSearchProgress').textContent =
      '已扫描 ' + data.scanned.toLocaleString() + ' / ' + data.totalRecords.toLocaleString() +
      ' (' + pct + '%)，命中 ' + data.totalMatches + ' 条';
    instrSearchPR.update(data.totalMatches, data.done);
    updateBadge('instrSearchBadge', data.totalMatches);
    if (data.done) {
      stopInstrSearch();
      document.getElementById('instrSearchProgress').textContent = '搜索完成，共 ' + data.totalMatches + ' 条匹配';
    }
  } catch(e) {}
}

async function jumpToInstr(idx) {
  const page = Math.floor(idx / PAGE_SIZE);
  await gotoPage(page);
  const row = container.querySelector('[data-idx="' + idx + '"]');
  if (row) row.scrollIntoView({ block: 'center' });
  selectInstruction(idx);
}

initInstrSearch();

function toggleSection(sectionId) {
  const sec = document.getElementById(sectionId);
  const body = sec.querySelector('.result-section-body');
  const arrow = sec.querySelector('.rs-arrow');
  if (body.classList.contains('collapsed')) {
    body.classList.remove('collapsed');
    arrow.classList.remove('collapsed');
  } else {
    body.classList.add('collapsed');
    arrow.classList.add('collapsed');
  }
}

function showSection(sectionId) {
  document.getElementById(sectionId).style.display = '';
}

function updateBadge(badgeId, count) {
  const el = document.getElementById(badgeId);
  if (el) el.textContent = count;
}

// ==================== 通用分页结果管理器 ====================
function PagedResults(opts) {
  // opts: { el, pageSize, renderRow, onClickRow, fetchUrl }
  this.el = opts.el;
  this.pageSize = opts.pageSize || 50;
  this.renderRow = opts.renderRow;
  this.onClickRow = opts.onClickRow;
  this.fetchUrl = opts.fetchUrl;
  this.page = 0;
  this.totalMatches = 0;
  this.lastDone = false;

  // 创建 DOM 结构
  this.listEl = document.createElement('div');
  this.listEl.style.maxHeight = '180px';
  this.listEl.style.overflowY = 'auto';
  this.pagerEl = document.createElement('div');
  this.pagerEl.className = 'results-pager';
  this.pagerEl.style.display = 'none';
  this.el.appendChild(this.listEl);
  this.el.appendChild(this.pagerEl);

  this.listEl.addEventListener('click', (e) => {
    const row = e.target.closest('.search-result-row');
    if (row && this.onClickRow) this.onClickRow(row);
  });
}

PagedResults.prototype.update = function(totalMatches, done) {
  this.totalMatches = totalMatches;
  this.lastDone = done;
  this.renderPager();
  this.loadPage(this.page);
};

PagedResults.prototype.renderPager = function() {
  const totalPages = Math.max(1, Math.ceil(this.totalMatches / this.pageSize));
  if (this.totalMatches <= this.pageSize) {
    this.pagerEl.style.display = 'none';
    return;
  }
  this.pagerEl.style.display = '';
  this.pagerEl.innerHTML =
    '<button class="pr-prev">◀</button>' +
    '<span>' + (this.page + 1) + ' / ' + totalPages + ' (' + this.totalMatches + ' 条)</span>' +
    '<button class="pr-next">▶</button>';
  const prev = this.pagerEl.querySelector('.pr-prev');
  const next = this.pagerEl.querySelector('.pr-next');
  prev.disabled = this.page <= 0;
  next.disabled = this.page >= totalPages - 1;
  const self = this;
  prev.onclick = () => { if (self.page > 0) { self.page--; self.loadPage(self.page); self.renderPager(); } };
  next.onclick = () => { if (self.page < totalPages - 1) { self.page++; self.loadPage(self.page); self.renderPager(); } };
};

PagedResults.prototype.loadPage = async function(page) {
  const off = page * this.pageSize;
  try {
    const data = await fetchJSON(this.fetchUrl + '&offset=' + off + '&limit=' + this.pageSize);
    const matches = data.matches || [];
    if (matches.length === 0) {
      this.listEl.innerHTML = '<div style="padding:6px;color:#808080;font-size:11px">暂无匹配</div>';
      return;
    }
    let html = '';
    for (const m of matches) {
      html += this.renderRow(m);
    }
    this.listEl.innerHTML = html;
  } catch(e) {
    this.listEl.innerHTML = '<div style="padding:6px;color:#808080;font-size:11px">加载失败</div>';
  }
};

PagedResults.prototype.reset = function() {
  this.page = 0;
  this.totalMatches = 0;
  this.listEl.innerHTML = '';
  this.pagerEl.style.display = 'none';
};

async function startSearch() {
  const pattern = document.getElementById('searchPattern').value.trim();
  const type = document.getElementById('searchType').value;
  if (!pattern) return;
  stopSearch();
  memSearchPR.reset();
  try {
    const resp = await fetch('/api/search', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({pattern, type})
    });

    searchId = data.searchId;

  if (searchPollTimer) { clearInterval(searchPollTimer); searchPollTimer = null; }
  document.getElementById('btnSearch').style.display = '';
  document.getElementById('btnStopSearch').style.display = 'none';
}

async function pollSearchResults() {
  if (!searchId) return;
  try {
    const data = await fetchJSON('/api/search/results?id=' + searchId + '&offset=0&limit=1');
    const pct = data.totalRecords > 0 ? Math.floor(data.scanned / data.totalRecords * 100) : 0;

      '已扫描 ' + data.scanned.toLocaleString() + ' / ' + data.totalRecords.toLocaleString() +

    memSearchPR.update(data.totalMatches, data.done);

    if (data.done) {

function drawRegTraceChart() {
  const canvas = document.getElementById('regTraceCanvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  if (regTraceData.length < 2) return;

  // 解析值
  const points = regTraceData.map(m => {
    let v = 0;
    try { v = parseInt(m.value, 16); } catch(e) {}
    return { idx: m.index, val: v };
  });

  const minVal = Math.min(...points.map(p => p.val));
  const maxVal = Math.max(...points.map(p => p.val));
  const range = maxVal - minVal || 1;
  const minIdx = points[0].idx;
  const maxIdx = points[points.length - 1].idx;
  const idxRange = maxIdx - minIdx || 1;

  const pad = 10;
  const pw = w - pad * 2;
  const ph = h - pad * 2;

  ctx.strokeStyle = '#569cd6';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < points.length; i++) {
    const x = pad + (points[i].idx - minIdx) / idxRange * pw;
    const y = pad + ph - (points[i].val - minVal) / range * ph;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // 标注最大最小值
  ctx.fillStyle = '#808080';
  ctx.font = '10px monospace';
  ctx.fillText('0x' + maxVal.toString(16), pad, pad + 10);
  ctx.fillText('0x' + minVal.toString(16), pad, h - pad);
}

const cfColors = [
  '#569cd6', '#4ec9b0', '#ce9178', '#dcdcaa', '#c586c0',
  '#d16969', '#6a9955', '#b5cea8', '#9cdcfe', '#d7ba7d'

// ==================== 虚拟滚动 ====================
const CF_LINE_H = 18;
let cfScrollEl = null, cfContentEl = null, cfViewEl = null;

function initVirtualScroll() {
  const body = document.getElementById('tlBody');
  body.innerHTML = '';
  body.style.overflow = 'hidden';

  cfScrollEl = document.createElement('div');
  cfScrollEl.style.cssText = 'height:100%;overflow-y:auto;position:relative';

  cfContentEl = document.createElement('div');
  cfContentEl.style.cssText = 'position:relative';

  cfViewEl = document.createElement('div');
  cfViewEl.style.cssText = 'position:absolute;left:0;right:0;top:0';

  cfContentEl.appendChild(cfViewEl);
  cfScrollEl.appendChild(cfContentEl);
  body.appendChild(cfScrollEl);

  updateVirtualHeight();
  cfScrollEl.addEventListener('scroll', () => {
    renderVisibleLines();
    loadMoreIfNeeded();
  });
  renderVisibleLines();
}

function getVisibleLines() { return cfFiltered || cfLines; }

function updateVirtualHeight() {
  cfContentEl.style.height = (getVisibleLines().length * CF_LINE_H) + 'px';
}

function renderVisibleLines() {
  const lines = getVisibleLines();
  const scrollTop = cfScrollEl.scrollTop;
  const viewH = cfScrollEl.clientHeight;
  const startIdx = Math.max(0, Math.floor(scrollTop / CF_LINE_H) - 5);
  const endIdx = Math.min(lines.length, Math.ceil((scrollTop + viewH) / CF_LINE_H) + 5);

  let html = '';
  for (let i = startIdx; i < endIdx; i++) {
    const line = lines[i];
    const top = i * CF_LINE_H;
    const fname = getFuncName(line.pc);
    const label = fname ? line.pc + ' (' + fname + ')' : line.pc;
    const colorIdx = parseInt(line.pc.slice(-4), 16) % cfColors.length;

    let indent, text, color, suffix = '', clickIdx;
    if (line.type === 'call') {
      indent = '│  '.repeat(Math.max(0, line.depth - 1)) + (line.depth > 0 ? '├─▶' : '');
      text = label;
      color = cfColors[colorIdx];
      const span = line.to - line.from;
      suffix = ' #' + line.from.toLocaleString() + (span > 1 ? '~#' + line.to.toLocaleString() : '') + ' (' + span.toLocaleString() + '条)';
      clickIdx = line.from;
    } else {
      indent = '│  '.repeat(Math.max(0, line.depth - 1)) + (line.depth > 0 ? '◀─ ' : '');
      // 返回地址 = bl 的 PC + 4
      const retPC = '0x' + (parseInt(line.pc, 16) + 4).toString(16);
      const retFname = getFuncName(line.pc);
      const retLabel = retFname ? retPC + ' (' + retFname + ')' : retPC;
      text = '返回 ' + retLabel;
      color = '#858585';
      clickIdx = line.to;
    }

    html += '<div class="cf-line" data-idx="' + clickIdx + '" data-text="' + escHtml(line.pc + ' ' + (fname || '')) + '" style="position:absolute;top:' + top + 'px;left:0;right:0;height:' + CF_LINE_H + 'px;line-height:' + CF_LINE_H + 'px;padding:0 8px;cursor:pointer;white-space:nowrap;overflow:hidden">'
      + '<span style="color:#555">' + escHtml(indent) + '</span>'
      + '<span style="color:' + color + '">' + escHtml(text) + '</span>'
      + (suffix ? '<span style="color:#808080">' + suffix + '</span>' : '')
      + '</div>';
  }
  cfViewEl.innerHTML = html;
}

document.getElementById('tlSearch').addEventListener('input', () => {
  const q = document.getElementById('tlSearch').value.trim().toLowerCase();
  if (!q) {
    cfFiltered = null;
  } else {
    cfFiltered = cfLines.filter(l => {
      const fname = getFuncName(l.pc) || '';
      return l.pc.toLowerCase().includes(q) || fname.toLowerCase().includes(q);
    });
  }
  updateVirtualHeight();
  cfScrollEl.scrollTop = 0;
  renderVisibleLines();
  const lines = getVisibleLines();
  document.getElementById('tlInfo').textContent = lines.length.toLocaleString() + ' \u884C' + (cfFiltered ? ' (\u8FC7\u6EE4\u81EA ' + cfLines.length.toLocaleString() + ')' : '');
});

init();
</script>
</body>
</html>
