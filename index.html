<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebTraceView</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Consolas', 'Monaco', 'Courier New', monospace; background: #1e1e1e; color: #d4d4d4; display: flex; flex-direction: column; height: 100vh; }
.header { background: #2d2d2d; padding: 8px 16px; border-bottom: 1px solid #404040; display: flex; align-items: center; gap: 12px; flex-shrink: 0; flex-wrap: wrap; }
.header h1 { font-size: 14px; color: #569cd6; }
.header .info { font-size: 12px; color: #808080; }
.header .indexing { color: #dcdcaa; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.header input { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 4px 8px; font-size: 12px; font-family: inherit; border-radius: 3px; }
.pager { display: flex; align-items: center; gap: 6px; }
.pager button { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 3px 10px; font-size: 12px; font-family: inherit; border-radius: 3px; cursor: pointer; }
.pager button:hover:not(:disabled) { background: #505050; }
.pager button:disabled { opacity: 0.4; cursor: default; }
.pager span { font-size: 12px; color: #9cdcfe; }
.main { display: flex; flex: 1; overflow: hidden; }
.instr-panel { width: 55%; border-right: 1px solid #404040; display: flex; flex-direction: column; }
.mem-panel { width: 45%; display: flex; flex-direction: column; }
.panel-header { background: #2d2d2d; padding: 6px 12px; font-size: 12px; color: #569cd6; border-bottom: 1px solid #404040; flex-shrink: 0; }
.instr-container { flex: 1; overflow-y: auto; }
.instr-row { padding: 2px 8px; font-size: 12px; cursor: pointer; display: flex; white-space: nowrap; border-bottom: 1px solid #2a2a2a; height: 22px; line-height: 18px; align-items: center; }
.instr-row:hover { background: #264f78; }
.instr-row.selected { background: #094771; }
.instr-row .idx { color: #858585; width: 70px; flex-shrink: 0; text-align: right; padding-right: 12px; }
.instr-row .pc { color: #4ec9b0; width: 120px; flex-shrink: 0; }
.instr-row .asm { color: #dcdcaa; width: 200px; flex-shrink: 0; }
.instr-row .regs { color: #9cdcfe; flex: 1; overflow: hidden; text-overflow: ellipsis; }
.mem-container { flex: 1; overflow-y: auto; padding: 8px; }
.mem-region { margin-bottom: 16px; }
.mem-region-header { color: #4ec9b0; font-size: 12px; margin-bottom: 4px; padding: 4px; background: #2d2d2d; border-radius: 3px; }
.mem-region-header.read { border-left: 3px solid #4ec9b0; }
.mem-region-header.write { border-left: 3px solid #ce9178; }
.hex-dump { font-size: 11px; line-height: 18px; }
.hex-line { display: flex; }
.hex-addr { color: #858585; width: 100px; flex-shrink: 0; }
.hex-bytes { color: #ce9178; flex: 1; letter-spacing: 0.5px; }
.hex-bytes .hl { background: #b5890069; color: #ffd700; font-weight: bold; }
.hex-ascii { color: #6a9955; width: 140px; flex-shrink: 0; padding-left: 8px; }
.hex-ascii .hl { background: #b5890069; color: #ffd700; font-weight: bold; }
.loading { color: #808080; padding: 20px; text-align: center; font-size: 13px; }
.status-bar { background: #007acc; color: white; padding: 2px 12px; font-size: 11px; flex-shrink: 0; display: flex; justify-content: space-between; }
.mem-search { display: flex; gap: 6px; padding: 6px 8px; background: #2d2d2d; border-bottom: 1px solid #404040; }
.mem-search input { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 3px 6px; font-size: 11px; font-family: inherit; border-radius: 3px; }
.mem-search button { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 3px 8px; font-size: 11px; font-family: inherit; border-radius: 3px; cursor: pointer; }
.mem-search button:hover { background: #505050; }
.global-search { display: flex; gap: 6px; padding: 6px 8px; background: #252525; border-bottom: 1px solid #404040; align-items: center; flex-wrap: wrap; }
.global-search input { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 3px 6px; font-size: 11px; font-family: inherit; border-radius: 3px; }
.global-search select { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 3px 4px; font-size: 11px; font-family: inherit; border-radius: 3px; }
.global-search button { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 3px 8px; font-size: 11px; font-family: inherit; border-radius: 3px; cursor: pointer; }
.global-search button:hover { background: #505050; }
.search-progress { font-size: 11px; color: #808080; }
.search-results { max-height: 200px; overflow-y: auto; border-bottom: 1px solid #404040; }
.search-result-row { padding: 3px 8px; font-size: 11px; cursor: pointer; display: flex; gap: 10px; border-bottom: 1px solid #2a2a2a; }
.search-result-row:hover { background: #264f78; }
.search-result-row .sr-idx { color: #858585; width: 60px; flex-shrink: 0; }
.search-result-row .sr-pc { color: #4ec9b0; width: 100px; flex-shrink: 0; }
.search-result-row .sr-instr { color: #dcdcaa; width: 160px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search-result-row .sr-addr { color: #ce9178; width: 100px; flex-shrink: 0; }
.search-result-row .sr-type { width: 30px; flex-shrink: 0; }
.sr-type.read { color: #4ec9b0; }
.sr-type.write { color: #ce9178; }
</style>
</head>
<body>
<div class="header">
  <h1>WebTraceView</h1>
  <span class="info" id="totalInfo">连接中...</span>
  <div class="pager">
    <button id="btnFirst" title="第一页">⏮</button>
    <button id="btnPrev" title="上一页">◀</button>
    <span id="pageInfo">-</span>
    <button id="btnNext" title="下一页">▶</button>
    <button id="btnLast" title="最后一页">⏭</button>
  </div>
  <input type="text" id="gotoBox" placeholder="跳转行号..." style="width:100px">
  <input type="text" id="gotoPage" placeholder="跳转页码..." style="width:100px">
</div>
<div class="main">
  <div class="instr-panel">
    <div class="panel-header">指令列表</div>
    <div class="instr-container" id="instrContainer"></div>
  </div>
  <div class="mem-panel">
    <div class="panel-header" id="memHeader">内存访问窗口 (点击左侧指令查看)</div>
    <div class="mem-search">
      <input type="text" id="hlAddr" placeholder="地址 0x..." style="width:110px">
      <input type="text" id="hlSize" placeholder="size" style="width:50px" value="4">
      <button id="btnHighlight">高亮</button>
      <button id="btnClearHl">清除</button>
    </div>
    <div class="global-search">
      <input type="text" id="searchPattern" placeholder="搜索 hex/字符串..." style="width:180px">
      <select id="searchType"><option value="hex">Hex</option><option value="string">String</option></select>
      <button id="btnSearch">搜索</button>
      <button id="btnStopSearch" style="display:none">停止</button>
      <span class="search-progress" id="searchProgress"></span>
    </div>
    <div class="search-results" id="searchResults" style="display:none"></div>
    <div class="mem-container" id="memContainer">
      <div class="loading">点击左侧任意指令查看该时刻的内存状态</div>
    </div>
  </div>
</div>
<div class="status-bar">
  <span id="statusBar">就绪</span>
  <span id="indexStatus"></span>
</div>

<script>
const PAGE_SIZE = 500;
let totalRecords = 0;
let indexDone = false;
let currentPage = 0;
let totalPages = 0;
let pageItems = [];
let selectedIdx = -1;
let loading = false;
let pollTimer = null;
let minPageInView = 0;
let hlAddr = -1, hlSize = 0;  // 高亮范围
let lastRegions = null;       // 缓存当前显示的 regions

const container = document.getElementById('instrContainer');

async function init() {
  await refreshInfo();
  await loadPage(0);

  // 翻页按钮
  document.getElementById('btnFirst').addEventListener('click', () => gotoPage(0));
  document.getElementById('btnPrev').addEventListener('click', () => gotoPage(currentPage - 1));
  document.getElementById('btnNext').addEventListener('click', () => gotoPage(currentPage + 1));
  document.getElementById('btnLast').addEventListener('click', () => gotoPage(totalPages - 1));

  // 滚到底自动下一页，滚到顶自动上一页
  container.addEventListener('scroll', () => {
    if (loading) return;
    const { scrollTop, scrollHeight, clientHeight } = container;
    // 滚到底
    if (scrollTop + clientHeight >= scrollHeight - 10) {
      if (currentPage < totalPages - 1) gotoPage(currentPage + 1, 'append');
    }
    // 滚到顶
    if (scrollTop <= 10) {
      if (minPageInView > 0) {
        minPageInView--;
        loadPagePrepend(minPageInView);
      }
    }
  });

  // 点击指令行
  container.addEventListener('click', e => {
    const row = e.target.closest('.instr-row');
    if (row) selectInstruction(parseInt(row.dataset.idx));
  });

  // 跳转行号
  document.getElementById('gotoBox').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const line = parseInt(e.target.value);
      if (!isNaN(line) && line >= 0 && line < totalRecords) {
        const page = Math.floor(line / PAGE_SIZE);
        gotoPage(page).then(() => {
          const row = container.querySelector('[data-idx="' + line + '"]');
          if (row) row.scrollIntoView({ block: 'center' });
        });
        e.target.value = '';
      }
    }
  });

  // 跳转页码
  document.getElementById('gotoPage').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const p = parseInt(e.target.value) - 1; // 用户输入从1开始
      if (!isNaN(p) && p >= 0 && p < totalPages) {
        gotoPage(p);
      }
      e.target.value = '';
    }
  });

  // 高亮搜索
  function applyHighlight() {
    const addrVal = document.getElementById('hlAddr').value.trim();
    const sizeVal = parseInt(document.getElementById('hlSize').value) || 0;
    if (!addrVal || sizeVal <= 0) return;
    hlAddr = parseInt(addrVal, 16);
    hlSize = sizeVal;
    if (lastRegions) renderMemory(lastRegions);
  }
  document.getElementById('btnHighlight').addEventListener('click', applyHighlight);
  document.getElementById('hlAddr').addEventListener('keydown', e => { if (e.key === 'Enter') applyHighlight(); });
  document.getElementById('hlSize').addEventListener('keydown', e => { if (e.key === 'Enter') applyHighlight(); });
  document.getElementById('btnClearHl').addEventListener('click', () => {
    hlAddr = -1; hlSize = 0;
    document.getElementById('hlAddr').value = '';
    if (lastRegions) renderMemory(lastRegions);
  });

  // 索引未完成时定时刷新
  pollTimer = setInterval(async () => {
    await refreshInfo();
    if (indexDone) {
      clearInterval(pollTimer);
      document.getElementById('indexStatus').textContent = '';
    }
  }, 2000);
}

async function refreshInfo() {
  try {
    const info = await fetchJSON('/api/info');
    totalRecords = info.totalRecords;
    indexDone = info.indexDone;
    totalPages = Math.max(1, Math.ceil(totalRecords / PAGE_SIZE));
    const el = document.getElementById('totalInfo');
    if (indexDone) {
      el.className = 'info';
      el.textContent = '共 ' + totalRecords.toLocaleString() + ' 条指令';
    } else {
      el.className = 'info indexing';
      el.textContent = '索引中... ' + totalRecords.toLocaleString() + ' 条';
      document.getElementById('indexStatus').textContent = '后台索引构建中...';
    }
    updatePagerUI();
  } catch(e) {}
}

function updatePagerUI() {
  document.getElementById('pageInfo').textContent =
    (currentPage + 1) + ' / ' + totalPages + ' 页';
  document.getElementById('btnFirst').disabled = currentPage <= 0;
  document.getElementById('btnPrev').disabled = currentPage <= 0;
  document.getElementById('btnNext').disabled = currentPage >= totalPages - 1;
  document.getElementById('btnLast').disabled = currentPage >= totalPages - 1;
}

async function gotoPage(page, mode) {
  if (page < 0 || page >= totalPages || loading) return;
  await loadPage(page, mode);
}

async function loadPage(page, mode) {
  loading = true;
  currentPage = page;
  if (mode !== 'append') minPageInView = page;
  updatePagerUI();

  const offset = page * PAGE_SIZE;
  const limit = PAGE_SIZE;

  document.getElementById('statusBar').textContent = '加载第 ' + (page + 1) + ' 页...';

  try {
    const data = await fetchJSON('/api/instructions?offset=' + offset + '&limit=' + limit);
    pageItems = data.items || [];
    totalRecords = data.total;
    totalPages = Math.max(1, Math.ceil(totalRecords / PAGE_SIZE));
    renderPage(mode);
    updatePagerUI();
    document.getElementById('statusBar').textContent =
      '第 ' + (page + 1) + ' 页，行 ' + offset + '-' + (offset + pageItems.length - 1) +
      '，共 ' + totalRecords.toLocaleString() + ' 条';
  } catch(e) {
    document.getElementById('statusBar').textContent = '加载失败';
  }
  loading = false;
}

async function loadPagePrepend(page) {
  if (loading || page < 0) return;
  loading = true;
  const offset = page * PAGE_SIZE;
  try {
    const data = await fetchJSON('/api/instructions?offset=' + offset + '&limit=' + PAGE_SIZE);
    const items = data.items || [];
    if (items.length === 0) { loading = false; return; }

    let html = '';
    for (const item of items) {
      const sel = item.index === selectedIdx ? ' selected' : '';
      html += '<div class="instr-row' + sel + '" data-idx="' + item.index + '">'
        + '<span class="idx">' + item.index + '</span>'
        + '<span class="pc">' + item.pc + '</span>'
        + '<span class="asm">' + escHtml(item.instrText) + '</span>'
        + '<span class="regs">' + escHtml(item.regText) + '</span>'
        + '</div>';
    }
    const prevHeight = container.scrollHeight;
    container.insertAdjacentHTML('afterbegin', html);
    // 保持滚动位置不跳
    container.scrollTop += container.scrollHeight - prevHeight;
  } catch(e) {}
  loading = false;
}

function renderPage(mode) {
  let html = '';
  for (const item of pageItems) {
    const sel = item.index === selectedIdx ? ' selected' : '';
    html += '<div class="instr-row' + sel + '" data-idx="' + item.index + '">'
      + '<span class="idx">' + item.index + '</span>'
      + '<span class="pc">' + item.pc + '</span>'
      + '<span class="asm">' + escHtml(item.instrText) + '</span>'
      + '<span class="regs">' + escHtml(item.regText) + '</span>'
      + '</div>';
  }
  if (mode === 'append') {
    container.insertAdjacentHTML('beforeend', html);
  } else {
    container.innerHTML = html;
    container.scrollTop = 0;
  }
}

async function selectInstruction(idx) {
  selectedIdx = idx;
  container.querySelectorAll('.instr-row.selected').forEach(el => el.classList.remove('selected'));
  const row = container.querySelector('[data-idx="' + idx + '"]');
  if (row) row.classList.add('selected');

  const memContainer = document.getElementById('memContainer');
  document.getElementById('memHeader').textContent = '内存访问窗口 - 指令 #' + idx;
  memContainer.innerHTML = '<div class="loading">正在还原内存状态...</div>';

  try {
    const data = await fetchJSON('/api/memory?index=' + idx);
    const regions = data.regions || [];
    lastRegions = regions;
    renderMemory(regions);
    document.getElementById('statusBar').textContent = '第 ' + idx + ' 条，' + regions.length + ' 个内存区域';
  } catch (e) {
    memContainer.innerHTML = '<div class="loading">加载失败: ' + escHtml(e.message) + '</div>';
  }
}

function renderMemory(regions) {
  const mc = document.getElementById('memContainer');
  if (!regions || regions.length === 0) {
    mc.innerHTML = '<div class="loading">该指令无内存访问</div>';
    return;
  }
  let html = '';
  for (const region of regions) {
    const typeClass = region.type === 'write' ? 'write' : 'read';
    const typeLabel = region.type === 'write' ? '[W]' : '[R]';
    html += '<div class="mem-region">'
      + '<div class="mem-region-header ' + typeClass + '">' + typeLabel + ' ' + escHtml(region.base) + ' (' + region.size + ' bytes)</div>'
      + '<div class="hex-dump">' + renderHexDump(region.base, region.hex) + '</div></div>';
  }
  mc.innerHTML = html;
}

function renderHexDump(baseStr, hexStr) {
  const base = parseInt(baseStr, 16);
  const bytesPerLine = 16;
  const totalBytes = hexStr.length / 2;
  const maxBytes = Math.min(totalBytes, 1024);
  let html = '';
  for (let off = 0; off < maxBytes; off += bytesPerLine) {
    const addr = (base + off).toString(16).padStart(10, '0');
    let hexPart = '';
    let asciiPart = '';
    const lineEnd = Math.min(bytesPerLine, maxBytes - off);
    for (let j = 0; j < lineEnd; j++) {
      const byteAddr = base + off + j;
      const bi = (off + j) * 2;
      const bh = hexStr.substring(bi, bi + 2);
      const bv = parseInt(bh, 16);
      const ch = (bv >= 32 && bv < 127) ? String.fromCharCode(bv) : '.';
      const isHl = hlAddr >= 0 && byteAddr >= hlAddr && byteAddr < hlAddr + hlSize;
      if (isHl) {
        hexPart += '<span class="hl">' + bh + '</span> ';
        asciiPart += '<span class="hl">' + escHtml(ch) + '</span>';
      } else {
        hexPart += bh + ' ';
        asciiPart += escHtml(ch);
      }
    }
    html += '<div class="hex-line">'
      + '<span class="hex-addr">' + addr + '</span>'
      + '<span class="hex-bytes">' + hexPart + '</span>'
      + '<span class="hex-ascii">' + asciiPart + '</span></div>';
  }
  if (totalBytes > maxBytes) {
    html += '<div style="color:#808080;padding:4px">... 还有 ' + (totalBytes - maxBytes).toLocaleString() + ' 字节</div>';
  }
  return html;
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.statusText);
  return r.json();
}

// ==================== 全局搜索 ====================
let searchId = null;
let searchPollTimer = null;

function initSearch() {
  document.getElementById('btnSearch').addEventListener('click', startSearch);
  document.getElementById('searchPattern').addEventListener('keydown', e => {
    if (e.key === 'Enter') startSearch();
  });
  document.getElementById('btnStopSearch').addEventListener('click', stopSearch);
  document.getElementById('searchResults').addEventListener('click', e => {
    const row = e.target.closest('.search-result-row');
    if (row) {
      const idx = parseInt(row.dataset.idx);
      const addr = row.dataset.addr;
      const plen = parseInt(row.dataset.plen) || 1;
      jumpToSearchResult(idx, addr, plen);
    }
  });
}

async function startSearch() {
  const pattern = document.getElementById('searchPattern').value.trim();
  const type = document.getElementById('searchType').value;
  if (!pattern) return;

  stopSearch();

  try {
    const resp = await fetch('/api/search', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({pattern, type})
    });
    const data = await resp.json();
    searchId = data.searchId;

    document.getElementById('btnSearch').style.display = 'none';
    document.getElementById('btnStopSearch').style.display = '';
    document.getElementById('searchResults').style.display = '';
    document.getElementById('searchResults').innerHTML = '<div style="padding:6px;color:#808080;font-size:11px">搜索中...</div>';
    document.getElementById('searchProgress').textContent = '搜索中...';

    searchPollTimer = setInterval(pollSearchResults, 500);
  } catch(e) {
    document.getElementById('searchProgress').textContent = '搜索启动失败';
  }
}

function stopSearch() {
  if (searchPollTimer) {
    clearInterval(searchPollTimer);
    searchPollTimer = null;
  }
  document.getElementById('btnSearch').style.display = '';
  document.getElementById('btnStopSearch').style.display = 'none';
}

async function pollSearchResults() {
  if (!searchId) return;
  try {
    const data = await fetchJSON('/api/search/results?id=' + searchId + '&offset=0&limit=200');
    renderSearchResults(data.matches || []);
    const pct = data.totalRecords > 0 ? Math.floor(data.scanned / data.totalRecords * 100) : 0;
    document.getElementById('searchProgress').textContent =
      '已扫描 ' + data.scanned.toLocaleString() + ' / ' + data.totalRecords.toLocaleString() +
      ' (' + pct + '%)，命中 ' + data.totalMatches + ' 条';

    if (data.done) {
      stopSearch();
      document.getElementById('searchProgress').textContent =
        '搜索完成，共 ' + data.totalMatches + ' 条匹配';
    }
  } catch(e) {}
}

function renderSearchResults(matches) {
  const el = document.getElementById('searchResults');
  if (matches.length === 0) {
    el.innerHTML = '<div style="padding:6px;color:#808080;font-size:11px">暂无匹配</div>';
    return;
  }
  let html = '';
  for (const m of matches) {
    const typeClass = m.type === 'write' ? 'write' : 'read';
    const typeLabel = m.type === 'write' ? 'W' : 'R';
    html += '<div class="search-result-row" data-idx="' + m.index + '" data-addr="' + m.chunkBase + '" data-plen="' + m.patternLen + '">'
      + '<span class="sr-idx">#' + m.index + '</span>'
      + '<span class="sr-pc">' + m.pc + '</span>'
      + '<span class="sr-instr">' + escHtml(m.instrText) + '</span>'
      + '<span class="sr-addr">' + m.chunkBase + '</span>'
      + '<span class="sr-type ' + typeClass + '">[' + typeLabel + ']</span>'
      + '</div>';
  }
  el.innerHTML = html;
}

async function jumpToSearchResult(idx, addrStr, patternLen) {
  // 设置高亮
  const addr = parseInt(addrStr, 16);
  hlAddr = addr;
  hlSize = patternLen;
  document.getElementById('hlAddr').value = addrStr;
  document.getElementById('hlSize').value = patternLen;

  // 跳转到对应页并选中指令
  const page = Math.floor(idx / PAGE_SIZE);
  await gotoPage(page);
  const row = container.querySelector('[data-idx="' + idx + '"]');
  if (row) row.scrollIntoView({ block: 'center' });
  selectInstruction(idx);
}

initSearch();

init();
</script>
</body>
</html>
