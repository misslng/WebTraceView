function loadMoreIfNeeded() {
  if (cfLoaded || cfLoading) return;
  const lines = getVisibleLines();
  const scrollTop = cfScrollEl.scrollTop;
  const viewH = cfScrollEl.clientHeight;
  const endIdx = Math.ceil((scrollTop + viewH) / CF_LINE_H);
  // 当滚动到已加载数据的 80% 时，拉下一批
  if (endIdx > cfLines.length * 0.8 && cfLines.length < cfTotal) {
    cfLoading = true;
    const batchSize = 2000;
    fetchJSON('/api/calltree?offset=' + cfLines.length + '&limit=' + batchSize + (cfTidFilter ? '&tid=' + cfTidFilter : '')).then(data => {
      const batch = data.lines || [];
      if (batch.length > 0) {
        cfLines = cfLines.concat(batch);
        if (cfFiltered === null) {
          updateVirtualHeight();
          renderVisibleLines();
        }
        document.getElementById('tlInfo').textContent = '已加载 ' + cfLines.length.toLocaleString() + ' / ' + cfTotal.toLocaleString() + ' 行';
      }
      if (cfLines.length >= cfTotal || batch.length === 0) {
        cfLoaded = true;
        document.getElementById('tlInfo').textContent = '共 ' + cfLines.length.toLocaleString() + ' 行';
      }
      cfLoading = false;
    }).catch(() => { cfLoading = false; });
  }
}

(function() {
  const panel = document.getElementById('timelineFloat');
  const bar = document.getElementById('tlDragBar');
  let dragging = false, dx = 0, dy = 0;
  bar.addEventListener('mousedown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
    dragging = true;
    dx = e.clientX - panel.offsetLeft;
    dy = e.clientY - panel.offsetTop;
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    panel.style.left = (e.clientX - dx) + 'px';
    panel.style.top = (e.clientY - dy) + 'px';
    panel.style.right = 'auto';
  });
  window.addEventListener('mouseup', () => { dragging = false; });
})();

const cfColors = [
  '#569cd6', '#4ec9b0', '#ce9178', '#dcdcaa', '#c586c0',
  '#d16969', '#6a9955', '#b5cea8', '#9cdcfe', '#d7ba7d'
];

// ==================== 虚拟滚动 ====================
const CF_LINE_H = 18;
let cfScrollEl = null, cfContentEl = null, cfViewEl = null;

function initVirtualScroll() {
  const body = document.getElementById('tlBody');
  body.innerHTML = '';
  body.style.overflow = 'hidden';

  cfScrollEl = document.createElement('div');
  cfScrollEl.style.cssText = 'height:100%;overflow-y:auto;position:relative';

  cfContentEl = document.createElement('div');
  cfContentEl.style.cssText = 'position:relative';

  cfViewEl = document.createElement('div');
  cfViewEl.style.cssText = 'position:absolute;left:0;right:0;top:0';

  cfContentEl.appendChild(cfViewEl);
  cfScrollEl.appendChild(cfContentEl);
  body.appendChild(cfScrollEl);

  updateVirtualHeight();
  cfScrollEl.addEventListener('scroll', () => {
    renderVisibleLines();
    loadMoreIfNeeded();
  });
  renderVisibleLines();
}

function getVisibleLines() { return cfFiltered || cfLines; }

function updateVirtualHeight() {
  cfContentEl.style.height = (getVisibleLines().length * CF_LINE_H) + 'px';
}

function renderVisibleLines() {
  const lines = getVisibleLines();
  const scrollTop = cfScrollEl.scrollTop;
  const viewH = cfScrollEl.clientHeight;
  const startIdx = Math.max(0, Math.floor(scrollTop / CF_LINE_H) - 5);
  const endIdx = Math.min(lines.length, Math.ceil((scrollTop + viewH) / CF_LINE_H) + 5);

  let html = '';
  for (let i = startIdx; i < endIdx; i++) {
    const line = lines[i];
    const top = i * CF_LINE_H;
    const fname = getFuncName(line.pc);
    const label = fname ? line.pc + ' (' + fname + ')' : line.pc;
    const colorIdx = parseInt(line.pc.slice(-4), 16) % cfColors.length;

    let indent, text, color, suffix = '', clickIdx;
    if (line.type === 'call') {
      indent = '│  '.repeat(Math.max(0, line.depth - 1)) + (line.depth > 0 ? '├─▶' : '');
      text = label;
      color = cfColors[colorIdx];
      const span = line.to - line.from;
      suffix = ' #' + line.from.toLocaleString() + (span > 1 ? '~#' + line.to.toLocaleString() : '') + ' (' + span.toLocaleString() + '条)';
      clickIdx = line.from;
    } else {
      indent = '│  '.repeat(Math.max(0, line.depth - 1)) + (line.depth > 0 ? '◀─ ' : '');
      // 返回地址 = bl 的 PC + 4
      const retPC = '0x' + (parseInt(line.pc, 16) + 4).toString(16);
      const retFname = getFuncName(line.pc);
      const retLabel = retFname ? retPC + ' (' + retFname + ')' : retPC;
      text = '返回 ' + retLabel;
      color = '#858585';
      clickIdx = line.to;
    }

    html += '<div class="cf-line" data-idx="' + clickIdx + '" data-text="' + escHtml(line.pc + ' ' + (fname || '')) + '" style="position:absolute;top:' + top + 'px;left:0;right:0;height:' + CF_LINE_H + 'px;line-height:' + CF_LINE_H + 'px;padding:0 8px;cursor:pointer;white-space:nowrap;overflow:hidden">'
      + '<span style="color:#555">' + escHtml(indent) + '</span>'
      + '<span style="color:' + color + '">' + escHtml(text) + '</span>'
      + (suffix ? '<span style="color:#808080">' + suffix + '</span>' : '')
      + '</div>';
  }
  cfViewEl.innerHTML = html;
}

document.getElementById('tlSearch').addEventListener('input', () => {
  const q = document.getElementById('tlSearch').value.trim().toLowerCase();
  if (!q) {
    cfFiltered = null;
  } else {
    cfFiltered = cfLines.filter(l => {
      const fname = getFuncName(l.pc) || '';
      return l.pc.toLowerCase().includes(q) || fname.toLowerCase().includes(q);
    });
  }
  updateVirtualHeight();
  cfScrollEl.scrollTop = 0;
  renderVisibleLines();
  const lines = getVisibleLines();
  document.getElementById('tlInfo').textContent = lines.length.toLocaleString() + ' \u884C' + (cfFiltered ? ' (\u8FC7\u6EE4\u81EA ' + cfLines.length.toLocaleString() + ')' : '');
});
